name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate example dataset
        run: python scripts/validate_dataset.py examples
      - name: Validate audited task subset
        run: python scripts/validate_task_subset.py configs/task_subset.json
