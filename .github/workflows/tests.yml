name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate example dataset
        run: python scripts/validate_dataset.py examples
      - name: Validate audited task subset
        run: python scripts/validate_task_subset.py configs/task_subset.json
      - name: Validate public writable-agent pilot
        run: python scripts/publish_pilot_matrix.py --output results/pilot_2026-08-10_writable_three_task --validate-existing
      - name: Validate development and holdout split
        run: python scripts/validate_study_design.py --subset configs/task_subset.json --split configs/study_split.json --design configs/confirmatory_design.json
      - name: Validate development-only oracle mutation evidence
        run: python scripts/audit_development_oracles.py --validate-existing
      - name: Validate confirmatory run schedule
        run: python scripts/generate_run_schedule.py --design configs/confirmatory_design.json --output configs/confirmatory_schedule.csv --validate-existing
      - name: Verify design snapshot hashes
        run: sha256sum --check configs/design_draft.sha256
